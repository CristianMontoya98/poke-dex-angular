<section class="mx-auto w-full max-w-5xl px-4 py-6">
  <img src="assets/img/logo.svg" alt="Pokemon" class="mx-auto mb-8 h-auto w-52" />

  @if (hasError()) {
    <p class="text-center text-red-400">No se pudo cargar la PokeAPI.</p>
  } @else {
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
      @if (isLoading()) {
        @for (slot of skeletonSlots; track slot) {
          <app-card [skeleton]="true" />
        }
      } @else {
        @for (pokemon of pokemons(); track pokemon.id) {
          <app-card [pokemon]="pokemon" />
        }
      }
    </div>

    @if (!isLoading()) {
      <nav
        class="mt-8 flex flex-wrap items-center justify-center gap-4"
        aria-label="Paginación de Pokémon"
      >
        <button
          type="button"
          class="rounded-lg bg-slate-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-600 disabled:cursor-not-allowed disabled:opacity-40"
          [disabled]="!canGoPrevious()"
          (click)="previousPage()"
        >
          Anterior
        </button>

        <p class="text-sm text-slate-300">
          Página {{ currentPage() }} de {{ totalPages() }}
        </p>

        <button
          type="button"
          class="rounded-lg bg-slate-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-600 disabled:cursor-not-allowed disabled:opacity-40"
          [disabled]="!canGoNext()"
          (click)="nextPage()"
        >
          Siguiente
        </button>
      </nav>
    }
  }
</section>
